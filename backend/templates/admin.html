{% extends "base.html" %}
{% block title %}Administração{% endblock %}

{% block content %}
<div class="app-header">
  <h1><i class="bi bi-gear-fill me-2" aria-hidden="true"></i>Administração</h1>
  <div class="subtitle" id="subtitulo">Olá!</div>
</div>

<div class="tabs-figma">
  <button class="tab-figma active" data-tab="categorias">Categorias</button>
  <button class="tab-figma" data-tab="materiais">Materiais</button>
  <button class="tab-figma" data-tab="eventos">Eventos</button>
  <button class="tab-figma" data-tab="comentarios">Coment.</button>
</div>

<div class="dashboard-area">
  <a href="/dashboard" class="text-decoration-none small text-white d-block mb-2">
    <i class="bi bi-arrow-left" aria-hidden="true"></i> voltar ao painel
  </a>
  <div id="conteudo"></div>
  <div class="error-msg" id="erro" aria-live="polite"></div>
</div>

<div class="app-footer">
  <button id="logout">Encerrar sessão</button>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/admin.js') }}?v=1"></script>
{% endblock %}
