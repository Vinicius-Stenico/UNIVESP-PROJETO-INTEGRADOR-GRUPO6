{% extends "base.html" %}
{% block title %}Detalhes da Solicitação{% endblock %}

{% block content %}
<div class="detail-area">
  <h2 style="color: var(--title-blue); font-weight: 700;">🔍 Solicitação #<span id="d-id">-</span></h2>
  <h3 class="mb-3" style="color: var(--title-blue); font-weight: 700;" id="d-titulo">…</h3>

  <div class="mb-3 small">
    <div id="d-solicitante"></div>
    <div id="d-data"></div>
    <div id="d-categoria"></div>
    <div id="d-status"></div>
  </div>

  <div id="d-itens-bloco" style="display:none;" class="detail-card">
    <div class="fw-bold mb-1">Itens solicitados:</div>
    <div id="d-itens-conteudo"></div>
  </div>

  <div class="detail-card" id="d-descricao">…</div>

  <div id="d-anexo-bloco" style="display:none;" class="mb-3">
    <div class="detail-card">
      <div class="fw-bold mb-2">Anexo</div>

      <div class="mb-2">
        📎 <span id="d-anexo-nome">arquivo</span>
      </div>

      <div class="d-flex gap-2 flex-wrap">
        <a id="d-anexo-link" href="#" target="_blank" class="btn btn-figma-outline btn-sm">
          Visualizar
        </a>

        <a id="d-anexo-download" href="#" class="btn btn-figma btn-sm">
          Baixar
        </a>
      </div>
    </div>
  </div>
  <h5 class="mb-2">Histórico</h5>
  <div class="hist-block" id="d-historico"></div>

  <h5 class="mb-2">Comentários</h5>
  <div class="hist-block" id="d-comentarios"></div>

  <div id="d-comentario-wrap" class="mb-3">
    <input class="form-control rounded-pill mb-2" id="d-comentario" placeholder="Adicionar comentário…">
    <button type="button" class="btn btn-figma-outline btn-sm" id="d-add-coment">Adicionar comentário</button>
  </div>

  <div class="d-flex flex-wrap gap-2 align-items-center mt-3">
    <div class="d-flex gap-2 me-auto" id="d-acoes" style="display:none;">
      <button type="button" class="btn btn-figma-outline" id="d-btn-primario"></button>
      <button type="button" class="btn btn-outline-secondary rounded-pill" id="d-btn-cancelar">Cancelar solicitação</button>
    </div>
    <button type="button" class="btn btn-figma ms-auto" id="d-btn-voltar">Voltar</button>
  </div>

  <div class="error-msg" id="d-erro"></div>
</div>

<div class="app-footer">
  <button id="logout">Encerrar sessão</button>
</div>
{% endblock %}

{% block scripts %}
<script>
  const usuario = AppCommon.requireUsuario();
  const ehSecretaria = usuario.tipo === 'secretaria' || usuario.tipo === 'admin';
  const id = "{{ chamado_id }}";

  let chamado = null;

  async function carregar() {
    try {
      chamado = await AppCommon.api('GET', `/api/chamados/${id}`);
      renderChamado();
      const [eventos, comentarios] = await Promise.all([
        AppCommon.api('GET', `/api/chamados/${id}/eventos`),
        AppCommon.api('GET', `/api/chamados/${id}/comentarios`),
      ]);
      renderHistorico(eventos);
      renderComentarios(comentarios);
      montarAcoes();

      // Status finalizado: tudo read-only (sem comentário, sem ações)
      const eFinalizado = chamado.status === 'Cancelado' || chamado.status === 'Concluído';
      document.getElementById('d-comentario-wrap').style.display = eFinalizado ? 'none' : '';
    } catch (e) {
      document.getElementById('d-erro').textContent = e.message;
    }
  }

  function parseDescricao(desc) {
    const out = { itens: null, texto: '' };
    if (!desc) return out;
    const linhas = desc.split('\n');
    const restante = [];
    linhas.forEach(l => {
      const m = l.match(/^Itens?:\s*(.+)$/i);
      if (m && !out.itens) out.itens = m[1].trim();
      else restante.push(l);
    });
    out.texto = restante.join('\n').trim();
    return out;
  }

  function renderChamado() {
    document.getElementById('d-id').textContent = chamado.id;
    document.getElementById('d-titulo').textContent = chamado.titulo;
    document.getElementById('d-data').innerHTML = `<strong>Data:</strong> ${AppCommon.escapeHtml((chamado.data_criacao||'').split(' ')[0])}`;
    if (chamado.categoria_nome) {
      document.getElementById('d-categoria').innerHTML = `<strong>Categoria:</strong> ${AppCommon.escapeHtml(chamado.categoria_nome)}`;
    }
    document.getElementById('d-status').innerHTML = `<strong>Status:</strong> <span class="tag-status">${AppCommon.escapeHtml(chamado.status)}</span>`;
    if (ehSecretaria) {
      document.getElementById('d-solicitante').innerHTML = `<strong>Solicitante:</strong> ${AppCommon.escapeHtml(chamado.usuario_nome || '-')}`;
    }
    const parsed = parseDescricao(chamado.descricao);
    if (parsed.itens) {
      document.getElementById('d-itens-bloco').style.display = '';
      document.getElementById('d-itens-conteudo').textContent = parsed.itens;
    }
    document.getElementById('d-descricao').textContent = parsed.texto || (parsed.itens ? '(sem descrição adicional)' : (chamado.descricao || '(sem descrição)'));

    if (chamado.tem_anexo) {
      document.getElementById('d-anexo-bloco').style.display = '';

      const linkVisualizar = document.getElementById('d-anexo-link');
      const linkDownload = document.getElementById('d-anexo-download');

      linkVisualizar.href = `/api/chamados/${chamado.id}/anexo`;
      linkDownload.href = `/api/chamados/${chamado.id}/anexo?download=1`;

      document.getElementById('d-anexo-nome').textContent = chamado.anexo_nome || 'arquivo anexado';
    }
  }

  function iconeEvento(tipo) {
    const mapa = {
      criacao: '📝',
      status: '🔄',
      comentario: '💬',
      edicao: '✏️',
      anexo: '📎',
      cancelamento: '🚫',
      reabertura: '🔁'
    };

    return mapa[tipo] || '•';
  }

  function renderHistorico(eventos) {
    const el = document.getElementById('d-historico');

    if (!eventos.length) {
      el.innerHTML = '<div class="hist-line">Sem eventos.</div>';
      return;
    }

    el.innerHTML = eventos.map(e => {
      const tag = e.status_novo
        ? ` <span class="tag-status">${AppCommon.escapeHtml(e.status_novo)}</span>`
        : '';

      return `
        <div class="hist-line">
          <strong>${iconeEvento(e.tipo)} ${AppCommon.escapeHtml(AppCommon.fmtDataCurta(e.data_criacao))}</strong><br>
          ${AppCommon.escapeHtml(e.descricao)}${tag}
        </div>
      `;
    }).join('');
  }

  function renderComentarios(comentarios) {
    const el = document.getElementById('d-comentarios');
    if (!comentarios.length) {
      el.innerHTML = '<div class="hist-line text-muted fst-italic">Não há comentários.</div>';
      return;
    }
    el.innerHTML = comentarios.map(c =>
      `<div class="hist-line"><strong>${AppCommon.escapeHtml(c.usuario_nome || '-')}</strong> · ${AppCommon.escapeHtml(AppCommon.fmtDataCurta(c.data_criacao))}<br>${AppCommon.escapeHtml(c.texto)}</div>`
    ).join('');
  }

  function montarAcoes() {
    const acoes = document.getElementById('d-acoes');
    const btnPri = document.getElementById('d-btn-primario');
    const btnCanc = document.getElementById('d-btn-cancelar');

    // Reset: tudo escondido por padrão
    acoes.style.display = 'none';
    btnPri.style.display = 'none';
    btnCanc.style.display = 'none';
    btnPri.onclick = null;
    btnCanc.onclick = null;

    const eAtivo = chamado.status === 'Aberto' || chamado.status === 'Em andamento';
    if (!eAtivo) return; // status Cancelado ou Concluído → sem ações

    const eDono = chamado.usuario_id === usuario.id;

    if (ehSecretaria) {
      btnPri.textContent = 'Concluir';
      btnPri.onclick = () => mudarStatus('Concluído');
      btnPri.style.display = '';
      btnCanc.textContent = 'Cancelar solicitação';
      btnCanc.onclick = () => mudarStatus('Cancelado');
      btnCanc.style.display = '';
    } else if (eDono) {
      // dono pode cancelar a própria solicitação ativa, mas não edita por aqui
      btnCanc.textContent = 'Cancelar solicitação';
      btnCanc.onclick = () => mudarStatus('Cancelado');
      btnCanc.style.display = '';
    }

    if (btnPri.style.display !== 'none' || btnCanc.style.display !== 'none') {
      acoes.style.display = 'flex';
    }
  }

  async function mudarStatus(novo) {
    document.getElementById('d-erro').textContent = '';
    const confirmacoes = {
      'Cancelado': 'Cancelar esta solicitação? Essa ação não pode ser desfeita.',
      'Concluído': 'Concluir esta solicitação?',
    };
    if (confirmacoes[novo] && !confirm(confirmacoes[novo])) return;

    const sucessos = {
      'Cancelado': 'Solicitação cancelada.',
      'Concluído': 'Solicitação concluída.',
      'Em andamento': 'Solicitação atualizada para Em andamento.',
    };
    try {
      await AppCommon.api('PUT', `/api/chamados/${id}/status`, { status: novo, usuario_id: usuario.id });
      alert(sucessos[novo] || 'Status atualizado.');
      window.location.href = '/dashboard';
    } catch (e) {
      document.getElementById('d-erro').textContent = e.message;
    }
  }

  document.getElementById('d-add-coment').onclick = async () => {
    document.getElementById('d-erro').textContent = '';
    const input = document.getElementById('d-comentario');
    const texto = input.value.trim();
    if (!texto) return;
    try {
      await AppCommon.api('POST', `/api/chamados/${id}/comentarios`, { usuario_id: usuario.id, texto });
      input.value = '';
      carregar();
    } catch (e) {
      document.getElementById('d-erro').textContent = e.message;
    }
  };

  document.getElementById('logout').onclick = () => AppCommon.logout('/login');
  document.getElementById('d-btn-voltar').onclick = () => { window.location.href = '/dashboard'; };

  carregar();
</script>
{% endblock %}
