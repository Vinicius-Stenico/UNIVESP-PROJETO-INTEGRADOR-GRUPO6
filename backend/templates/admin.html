{% extends "base.html" %}
{% block title %}Administração{% endblock %}

{% block content %}
<div class="app-header">
  <h1>⚙️ Administração</h1>
  <div class="subtitle" id="subtitulo">Olá!</div>
</div>

<div class="tabs-figma">
  <button class="tab-figma active" data-tab="usuarios">Usuários</button>
  <button class="tab-figma" data-tab="categorias">Categorias</button>
  <button class="tab-figma" data-tab="materiais">Materiais</button>
  <button class="tab-figma" data-tab="eventos">Eventos</button>
  <button class="tab-figma" data-tab="comentarios">Coment.</button>
</div>

<div class="dashboard-area">
  <a href="/dashboard" class="text-decoration-none small text-white d-block mb-2">← voltar ao painel</a>
  <div id="conteudo"></div>
  <div class="error-msg" id="erro"></div>
</div>

<div class="app-footer">
  <button id="logout">Encerrar sessão</button>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/common.js') }}?v=20"></script>

<script>
async function iniciarAdmin() {
  const usuario = await AppCommon.requireUsuario();

  if (!usuario) {
    return;
  }

  if (usuario.tipo !== 'admin') {
    alert('Acesso restrito ao administrador.');
    window.location.href = '/dashboard';
    return;
  }

  document.getElementById('subtitulo').textContent = `Olá, ${usuario.nome}!`;
  document.getElementById('logout').onclick = () => AppCommon.logout('/login');

  let abaAtiva = 'usuarios';
  document.querySelectorAll('.tab-figma').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.tab-figma').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      abaAtiva = b.dataset.tab;
      renderAba();
    };
  });

  async function renderAba() {
    document.getElementById('erro').textContent = '';

    const conteudo = document.getElementById('conteudo');
    conteudo.innerHTML = '<div class="empty-msg">Carregando…</div>';

    try {
      if (abaAtiva === 'usuarios') await renderUsuarios(conteudo);
      else if (abaAtiva === 'categorias') await renderCategorias(conteudo);
      else if (abaAtiva === 'materiais') await renderMateriais(conteudo);
      else if (abaAtiva === 'eventos') await renderEventos(conteudo);
      else if (abaAtiva === 'comentarios') await renderComentarios(conteudo);
    } catch (e) {
      document.getElementById('erro').textContent = e.message;
      conteudo.innerHTML = '';
    }
  }

  async function renderUsuarios(root) {
    const users = await AppCommon.api('GET', '/api/usuarios?todos=1');
    root.innerHTML = `
      <div class="card-figma">
        <h6 class="text-secondary">Novo usuário</h6>
        <form id="user-form" class="d-flex flex-column gap-2">
          <input class="form-control rounded-pill" id="user-nome" placeholder="Nome" required>
          <input class="form-control rounded-pill" id="user-email" type="email" placeholder="Email" required>
          <input class="form-control rounded-pill" id="user-senha" type="password" placeholder="Senha" required>
          <select class="form-select rounded-pill" id="user-tipo" required>
            <option value="professor">Professor</option>
            <option value="secretaria">Secretaria</option>
            <option value="admin">Admin</option>
          </select>
          <button type="submit" class="btn btn-figma btn-sm align-self-end">Salvar</button>
        </form>
      </div>
      <div class="card-figma">
        <h6 class="text-secondary">Usuários (${users.length})</h6>
        ${users.map(u => `
          <div class="user-row border-bottom py-2 small" data-id="${u.id}">
            <div class="user-view d-flex align-items-center justify-content-between">
              <div class="me-2">
                <div><span class="fw-bold">#${u.id}</span> ${AppCommon.escapeHtml(u.nome)}</div>
                <div class="text-muted" style="font-size:0.78rem;">
                  ${AppCommon.escapeHtml(u.email)} · ${AppCommon.escapeHtml(u.tipo)} ·
                  ${u.ativo ? '<span class="text-success">● Ativo</span>' : '<span class="text-muted">○ Inativo</span>'}
                </div>
              </div>
              <div class="acoes-vert">
                <button class="btn-link-mini" data-act="edit" data-id="${u.id}">Editar</button>
                <button class="btn-link-mini" data-act="toggle" data-id="${u.id}" data-ativo="${!u.ativo}"${u.id === usuario.id ? ' disabled title="Não pode desativar a si mesmo"' : ''}>${u.ativo ? 'Desativar' : 'Reativar'}</button>
              </div>
            </div>
            <div class="user-edit" style="display:none;">
              <form class="d-flex flex-column gap-2 mt-2">
                <input class="form-control rounded-pill form-control-sm" name="nome" value="${AppCommon.escapeHtml(u.nome)}" required>
                <input class="form-control rounded-pill form-control-sm" name="email" type="email" value="${AppCommon.escapeHtml(u.email)}" required>
                <input class="form-control rounded-pill form-control-sm" name="senha" type="password" placeholder="Nova senha (deixe em branco para manter)">
                <select class="form-select rounded-pill form-select-sm" name="tipo">
                  <option value="professor"${u.tipo === 'professor' ? ' selected' : ''}>Professor</option>
                  <option value="secretaria"${u.tipo === 'secretaria' ? ' selected' : ''}>Secretaria</option>
                  <option value="admin"${u.tipo === 'admin' ? ' selected' : ''}>Admin</option>
                </select>
                <div class="d-flex gap-2 justify-content-end">
                  <button type="button" class="btn btn-sm btn-outline-secondary" data-act="cancel">Cancelar</button>
                  <button type="submit" class="btn btn-sm btn-figma">Salvar</button>
                </div>
              </form>
            </div>
          </div>
        `).join('')}
      </div>
    `;
    document.getElementById('user-form').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await AppCommon.api('POST', '/api/usuarios', {
          nome: document.getElementById('user-nome').value,
          email: document.getElementById('user-email').value,
          senha: document.getElementById('user-senha').value,
          tipo: document.getElementById('user-tipo').value,
        });
        renderAba();
      } catch (er) { alert(er.message); }
    };
    root.querySelectorAll('button[data-act]').forEach(b => {
      b.onclick = async () => {
        const row = b.closest('.user-row');
        try {
          if (b.dataset.act === 'edit') {
            row.querySelector('.user-view').style.display = 'none';
            row.querySelector('.user-edit').style.display = 'block';
          } else if (b.dataset.act === 'cancel') {
            row.querySelector('.user-view').style.display = '';
            row.querySelector('.user-edit').style.display = 'none';
          } else if (b.dataset.act === 'toggle') {
            await AppCommon.api('PUT', `/api/usuarios/${b.dataset.id}`, { ativo: b.dataset.ativo === 'true' });
            renderAba();
          }
        } catch (er) { alert(er.message); }
      };
    });
    root.querySelectorAll('.user-edit form').forEach(f => {
      f.onsubmit = async (e) => {
        e.preventDefault();
        const row = f.closest('.user-row');
        const id = row.dataset.id;
        const payload = {
          nome: f.nome.value,
          email: f.email.value,
          tipo: f.tipo.value,
        };
        if (f.senha.value) payload.senha = f.senha.value;
        try {
          await AppCommon.api('PUT', `/api/usuarios/${id}`, payload);
          renderAba();
        } catch (er) { alert(er.message); }
      };
    });
  }

  async function renderCategorias(root) {
    const cats = await AppCommon.api('GET', '/api/categorias?todas=1');

    root.innerHTML = `
      <div class="card-figma">
        <h6 class="text-secondary">Nova categoria</h6>
        <form id="cat-form" class="d-flex gap-2 align-items-center flex-wrap">
          <input class="form-control rounded-pill flex-grow-1" id="cat-nome" placeholder="Nome" required style="min-width:120px;">
          <button type="submit" class="btn btn-figma btn-sm">Salvar</button>
        </form>
      </div>

      <div class="card-figma">
        <h6 class="text-secondary">Categorias (${cats.length})</h6>
        ${cats.map(c => `
          <div class="d-flex align-items-center justify-content-between border-bottom py-2 small">
            <div>
              <span class="fw-bold">#${c.id}</span> ${AppCommon.escapeHtml(c.nome)}
              <span class="ms-2 ${c.ativo ? 'text-success' : 'text-muted'}">
                ${c.ativo ? '● Ativa' : '○ Inativa'}
              </span>
            </div>

            <div class="acoes-vert">
              <button class="btn-link-mini" data-act="toggle" data-id="${c.id}" data-ativo="${!c.ativo}">
                ${c.ativo ? 'Desativar' : 'Reativar'}
              </button>
              <button class="btn-link-mini danger" data-act="del" data-id="${c.id}">
                Excluir
              </button>
            </div>
          </div>
        `).join('')}
      </div>
    `;

    document.getElementById('cat-form').onsubmit = async (e) => {
      e.preventDefault();

      try {
        await AppCommon.api('POST', '/api/categorias', {
          nome: document.getElementById('cat-nome').value
        });

        renderAba();

      } catch (er) {
        alert(er.message);
      }
    };

    root.querySelectorAll('button[data-act]').forEach(b => {
      b.onclick = async () => {
        try {
          if (b.dataset.act === 'toggle') {
            await AppCommon.api('PUT', `/api/categorias/${b.dataset.id}`, {
              ativo: b.dataset.ativo === 'true'
            });
          } else if (b.dataset.act === 'del') {
            if (!confirm('Excluir categoria?')) {
              return;
            }

            await AppCommon.api('DELETE', `/api/categorias/${b.dataset.id}`);
          }

          renderAba();

        } catch (er) {
          alert(er.message);
        }
      };
    });
  }

  async function renderMateriais(root) {
    const [mats, cats] = await Promise.all([
      AppCommon.api('GET', '/api/materiais?todos=1'),
      AppCommon.api('GET', '/api/categorias'),
    ]);

    const opcoes = cats.map(c => `
      <option value="${c.id}">${AppCommon.escapeHtml(c.nome)}</option>
    `).join('');

    root.innerHTML = `
      <div class="card-figma">
        <h6 class="text-secondary">Novo material</h6>

        <form id="mat-form" class="d-flex flex-column gap-2">
          <input class="form-control rounded-pill" id="mat-nome" placeholder="Nome do material" required>

          <select class="form-select rounded-pill" id="mat-cat">
            <option value="">Sem categoria</option>
            ${opcoes}
          </select>

          <input class="form-control rounded-pill" id="mat-unid" placeholder="Unidade (ex: un, cx)">

          <button type="submit" class="btn btn-figma btn-sm align-self-end">
            Salvar
          </button>
        </form>
      </div>

      <div class="card-figma">
        <h6 class="text-secondary">Materiais (${mats.length})</h6>

        ${mats.map(m => `
          <div class="d-flex align-items-center justify-content-between border-bottom py-2 small">
            <div class="me-2">
              <div>
                <span class="fw-bold">#${m.id}</span>
                ${AppCommon.escapeHtml(m.nome)}
                ${m.unidade ? `<span class="text-muted">(${AppCommon.escapeHtml(m.unidade)})</span>` : ''}
              </div>

              <div class="text-muted" style="font-size:0.78rem;">
                ${AppCommon.escapeHtml(m.categoria_nome || '—')} ·
                ${m.ativo ? '<span class="text-success">● Ativo</span>' : '<span class="text-muted">○ Inativo</span>'}
              </div>
            </div>

            <div class="acoes-vert">
              <button class="btn-link-mini" data-act="toggle" data-id="${m.id}" data-ativo="${!m.ativo}">
                ${m.ativo ? 'Desativar' : 'Reativar'}
              </button>

              <button class="btn-link-mini danger" data-act="del" data-id="${m.id}">
                Excluir
              </button>
            </div>
          </div>
        `).join('')}
      </div>
    `;

    document.getElementById('mat-form').onsubmit = async (e) => {
      e.preventDefault();

      try {
        await AppCommon.api('POST', '/api/materiais', {
          nome: document.getElementById('mat-nome').value,
          categoria_id: parseInt(document.getElementById('mat-cat').value) || null,
          unidade: document.getElementById('mat-unid').value || null,
        });

        renderAba();

      } catch (er) {
        alert(er.message);
      }
    };

    root.querySelectorAll('button[data-act]').forEach(b => {
      b.onclick = async () => {
        try {
          if (b.dataset.act === 'toggle') {
            await AppCommon.api('PUT', `/api/materiais/${b.dataset.id}`, {
              ativo: b.dataset.ativo === 'true'
            });
          } else if (b.dataset.act === 'del') {
            if (!confirm('Excluir material?')) {
              return;
            }

            await AppCommon.api('DELETE', `/api/materiais/${b.dataset.id}`);
          }

          renderAba();

        } catch (er) {
          alert(er.message);
        }
      };
    });
  }

  async function renderEventos(root) {
    const eventos = await AppCommon.api('GET', '/api/eventos?limite=200');

    if (!eventos.length) {
      root.innerHTML = `
        <div class="empty-msg" style="color:var(--text-muted);background:#fff;border-radius:12px;">
          Nenhum evento.
        </div>
      `;
      return;
    }

    root.innerHTML = `
      <div class="card-figma">
        <h6 class="text-secondary">Eventos (${eventos.length})</h6>

        ${eventos.map(e => `
          <div class="lista-item">
            <div class="lista-meta">
              <span class="lista-tag">#${e.chamado_id}</span>
              <span class="lista-tipo">${AppCommon.escapeHtml(e.tipo)}</span>
              ${e.status_novo ? `<span class="lista-status">${AppCommon.escapeHtml(e.status_novo)}</span>` : ''}
              <span class="lista-data">${AppCommon.escapeHtml(e.data_criacao)}</span>
            </div>

            <div class="lista-corpo">
              ${AppCommon.escapeHtml(e.descricao)}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  async function renderComentarios(root) {
    const comentarios = await AppCommon.api('GET', '/api/comentarios');

    if (!comentarios.length) {
      root.innerHTML = `
        <div class="empty-msg" style="color:var(--text-muted);background:#fff;border-radius:12px;">
          Nenhum comentário.
        </div>
      `;
      return;
    }

    root.innerHTML = `
      <div class="card-figma">
        <h6 class="text-secondary">Comentários (${comentarios.length})</h6>

        ${comentarios.map(c => `
          <div class="lista-item">
            <div class="lista-meta">
              <span class="lista-tag">#${c.chamado_id}</span>
              <strong>${AppCommon.escapeHtml(c.usuario_nome || '-')}</strong>
              <span class="lista-data">${AppCommon.escapeHtml(c.data_criacao)}</span>
            </div>

            <div class="lista-corpo">
              ${AppCommon.escapeHtml(c.texto)}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  renderAba();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', iniciarAdmin);
} else {
  iniciarAdmin();
}
</script>
{% endblock %}
